services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-product_scanner}
      POSTGRES_USER: ${DB_USER:-scanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scanner_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scanner}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-scanner}:${DB_PASSWORD:-scanner_dev}@db:5432/${DB_NAME:-product_scanner}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      VISION_API_KEY: ${VISION_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: